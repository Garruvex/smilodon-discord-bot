schemaVersion: 1

guild:
  id: "123456789012345678"
  name: "Example Community"

branding:
  displayName: "Community Bot"
  embedColor: "#3B82F6"
  # Optional image displayed when the player is idle.
  idleImageUrl: null

panel:
  progressBar:
    # standard, yohta, custom, or none. Configure custom emojis with /settings panel.
    style: standard
    length: 12

features:
  common: true
  diagnostics: true
  music: true
  chatbot: false
  # Requires channels.birthdayAnnouncements to be set. Configure with /settings birthdays.
  birthdays: false
  # NSFW image commands (e.g. /e621). Discord's per-channel age restriction still applies
  # regardless of this flag. Configure with /settings nsfw.
  nsfw: false
  # Rewrites Twitter/X, TikTok, Instagram, and Reddit links posted in watched channels
  # into embed-friendly proxy links. Requires channels.linkFix to be set. Configure with
  # /settings link-fix.
  linkFix: false

roles:
  botAdministrator:
    - "234567890123456789"
  musicController:
    - "345678901234567890"
  restricted:
    - "456789012345678901"
  # Members with this role may use @bot mention chat. Bot administrators inherit access.
  chatbot: []

channels:
  # An empty list allows music commands in every channel.
  musicCommands:
    - "567890123456789012"
  controlPanel: null
  auditLog: null
  # An empty list permits mention chat in every channel when enabled.
  chatbot: []
  # Channel that receives the daily "Happy Birthday" announcement. Required if features.birthdays is true.
  birthdayAnnouncements: null
  # Channels watched for rewritable links. Required (non-empty) if features.linkFix is true.
  linkFix: []

chat:
  # Null loads config/local/personalities/<guild-id>.md when present.
  personalityFile: null
  # Set automatically by /settings chatbot personality:<markdown attachment>.
  personalityAsset: null
  cooldownSeconds: 30
  deniedMessage: "This feature requires a premium subscription. Try looking richer and ask again."
  # Optional link button shown alongside the denied message. Both null by default (no button).
  deniedLinkUrl: null
  deniedLinkLabel: null
  # Responses API capabilities; disabled by default for cost and privacy.
  webSearchMode: off
  imageInputEnabled: false
  imageGenerationEnabled: false
  includeSources: true
  maxImagesPerRequest: 2

music:
  volume:
    default: 75
    maximum: 150
    buttonStep: 10

  emptyQueue:
    action: disconnect
    delayMs: 120000

  emptyChannel:
    action: pause
    gracePeriodMs: 30000
    resumeWhenOccupied: true
