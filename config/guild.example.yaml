schemaVersion: 1

guild:
  id: "123456789012345678"
  name: "Example Community"

branding:
  displayName: "Community Bot"
  embedColor: "#3B82F6"
  idleImageUrl: null

panel:
  progressBar:
    # standard, custom, or none. Configure custom emojis with /settings music panel.
    style: standard
    length: 12

features:
  common: true
  diagnostics: true
  music: true

roles:
  botAdministrator:
    - "234567890123456789"
  musicController:
    - "345678901234567890"
  restricted:
    - "456789012345678901"

channels:
  # An empty list allows music commands in every channel.
  musicCommands:
    - "567890123456789012"
  controlPanel: null
  auditLog: null

music:
  volume:
    default: 75
    maximum: 150
    buttonStep: 10

  emptyQueue:
    action: disconnect
    delayMs: 120000

  emptyChannel:
    action: pause
    gracePeriodMs: 30000
    resumeWhenOccupied: true

# Normally managed via `/settings chat context-scan-add|context-daily-add|
# context-daily-remove|context-remove|context-status` rather than edited
# directly — shown here only so self-hosted installs know the shape. Both
# lists are no-ops unless a chat provider is configured (CHATBOT_* or
# UTILITY_*) that supports channel summarization; see the README's
# "Channel-context memory" section.
# chat:
#   contextScanChannelIds:
#     - "678901234567890123"
#   contextDailyChannelIds:
#     - "678901234567890123"
#   contextSeedDays: 7
