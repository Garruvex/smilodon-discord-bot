# Copy this file to compose.yaml, then copy the bot-myinstance service once per
# Discord application. Shared infrastructure values come from the root .env;
# application values come from config/instances/<name>.env.

x-bot-environment: &bot-environment
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LAVALINK_HOST: lavalink
  LAVALINK_PORT: 2333
  LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:?Set LAVALINK_PASSWORD in .env}
  LAVALINK_SECURE: "false"
  DATABASE_URL: postgresql://${POSTGRES_USER:-fntu_bot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fntu_bot}
  PERSISTENCE_DRIVER: postgres

x-bot-service: &bot-service
  image: fntu-discord-bot-runtime:local
  build:
    context: .
  command: node dist/scripts/start-docker-instance.js
  restart: unless-stopped
  depends_on:
    postgres-setup:
      condition: service_completed_successfully
    lavalink:
      condition: service_healthy
  volumes:
    - ./config/local:/app/config/local
    - ${DATA_ROOT:-./data}/instances:/app/data/instances

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fntu_bot}
      POSTGRES_USER: ${POSTGRES_USER:-fntu_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - ${DATA_ROOT:-./data}/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  postgres-setup:
    image: pgvector/pgvector:0.8.6-pg17
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-fntu_bot}
      PGUSER: ${POSTGRES_USER:-fntu_bot}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    entrypoint: ["/bin/sh", "-c"]
    command: ["psql -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector;'"]

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4-alpine
    restart: unless-stopped
    environment:
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:?Set LAVALINK_PASSWORD in .env}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      _JAVA_OPTIONS: -Xms256m -Xmx768m
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - ${DATA_ROOT:-./data}/lavalink/plugins:/opt/Lavalink/plugins
      - ${DATA_ROOT:-./data}/lavalink/logs:/opt/Lavalink/logs
    ports:
      - "127.0.0.1:${LAVALINK_PORT:-2333}:2333"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header=\"Authorization: $${LAVALINK_PASSWORD}\" http://127.0.0.1:2333/version >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Duplicate this service for each application. Replace every "myinstance"
  # with the INSTANCE_NAME and instance env filename you want to run.
  bot-myinstance:
    <<: *bot-service
    env_file:
      - ./config/instances/myinstance.env
    environment:
      <<: *bot-environment
      GUILD_CONFIG_DIRECTORY: /app/config/local/instances/myinstance/guilds
      RUNTIME_DATA_DIRECTORY: /app/data/instances/myinstance
