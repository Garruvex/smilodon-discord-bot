# Standalone evaluation service; does not modify the deployed bot stack.
services:
  laya:
    image: fntu-laya-eval:0.4.13-${LAYA_TORCH_INDEX:-cu130}
    build:
      context: ./docker
      dockerfile: laya.Dockerfile
      args:
        TORCH_INDEX: ${LAYA_TORCH_INDEX:-cu130}
    restart: "no"
    ports:
      - "127.0.0.1:${LAYA_PORT:-8000}:8000"
    environment:
      LAYA_HOST: 0.0.0.0
      LAYA_PORT: "8000"
      LAYA_DEVICE: cuda
      LAYA_CUDA_AMP: fp16
      LAYA_MODELS: multilingual
      LAYA_PRELOAD: "1"
      LAYA_MAX_LOADED: "1"
      LAYA_DEFAULT_MODEL: multilingual
      LAYA_MAX_TOKEN_BUDGET: "8192"
      LAYA_MAX_CONCURRENT: "4"
      LAYA_JEV_STRICT: "0"
      LAYA_REVISION: reviewed
      LAYA_API_KEY: ${LAYA_API_KEY:-}
    volumes:
      - laya-model-cache:/home/laya/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${LAYA_GPU_ID:-0}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 300s

volumes:
  laya-model-cache:
